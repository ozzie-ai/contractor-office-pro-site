name: ContractorOfficePro
options:
  bundleIdPrefix: com.derekflores
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
knownRegions: [en, es, Base]
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.5
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    # swift-concurrency skill: approachable concurrency + MainActor-by-default for app code (SE-0466).
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    # ios-localization skill: compile-time-checked keys from Localizable.xcstrings.
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ContractorOfficePro:
    type: application
    platform: iOS
    sources:
      - path: ContractorOfficePro
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.derekflores.contractorofficepro
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ContractorOfficePro/Resources/Info.plist
      properties:
        CFBundleDisplayName: ContractorOfficePro
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
  ContractorOfficeProTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ContractorOfficeProTests
    dependencies:
      - target: ContractorOfficePro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ContractorOfficePro.app/ContractorOfficePro
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  ContractorOfficePro:
    build:
      targets:
        ContractorOfficePro: all
        ContractorOfficeProTests: [test]
    test:
      targets: [ContractorOfficeProTests]
      gatherCoverageData: true
