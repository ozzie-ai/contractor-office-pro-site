name: ContractorOfficePro
options:
  bundleIdPrefix: com.derekflores
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
knownRegions: [en, es, Base]
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.5
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    # swift-concurrency skill: approachable concurrency + MainActor-by-default for app code (SE-0466).
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    # ios-localization skill: compile-time-checked keys from Localizable.xcstrings.
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ContractorOfficePro:
    type: application
    platform: iOS
    sources:
      - path: ContractorOfficePro
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.derekflores.contractorofficepro
        DEVELOPMENT_TEAM: 986GMWGB5V
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: ContractorOfficePro/Resources/Info.plist
      properties:
        CFBundleDisplayName: ContractorOfficePro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        # Only standard HTTPS (exempt), so TestFlight doesn't ask the export-compliance question each upload.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take photos of the job so the AI can see it. Photos stay private on your iPhone.
        NSMicrophoneUsageDescription: Lets you describe the job by voice. Audio stays on your iPhone.
        NSSpeechRecognitionUsageDescription: Turns what you say into job notes, on your iPhone.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        BackendURL: $(BACKEND_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  ContractorOfficeProTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ContractorOfficeProTests
    dependencies:
      - target: ContractorOfficePro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ContractorOfficePro.app/ContractorOfficePro
        BUNDLE_LOADER: $(TEST_HOST)
  ContractorOfficeProUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ContractorOfficeProUITests
    dependencies:
      - target: ContractorOfficePro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ContractorOfficePro
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  ContractorOfficePro:
    build:
      targets:
        ContractorOfficePro: all
        ContractorOfficeProTests: [test]
        ContractorOfficeProUITests: [test]
    test:
      targets: [ContractorOfficeProTests, ContractorOfficeProUITests]
      gatherCoverageData: true
