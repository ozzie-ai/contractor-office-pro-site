name: Contractor Office Pro regression checks
on:
  push:
    paths:
      - 'index.html'
      - 'core/**'
      - 'api/**'
      - 'level2.html'
      - 'tests/**'
      - '.github/workflows/regression.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'core/**'
      - 'tests/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run electrical regression cases
        run: node tests/run-tests.mjs
      - name: Run cost-model and retailer verification regression checks
        run: node tests/job-pricing.test.mjs
      - name: Run Level 2 backend smoke tests
        run: node tests/level2-api.test.mjs
