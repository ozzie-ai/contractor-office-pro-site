name: Supabase public-data isolation check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/supabase-public-isolation.yml
      - mobile/.env.example

permissions:
  contents: read

jobs:
  anonymous-data-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual hosted anonymous access cannot read contractor data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          config={}
          for line in Path("mobile/.env.example").read_text().splitlines():
              if line.startswith("EXPO_PUBLIC_") and "=" in line:
                  k,v=line.split("=",1)
                  config[k]=v.strip()
          base=config["EXPO_PUBLIC_SUPABASE_URL"].rstrip("/")
          key=config["EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"]
          assert base == "https://xhbbshryjdcotvwuslxd.supabase.co"
          assert key.startswith("sb_publishable_")
          targets=("cop_research_references","jobs","price_book_items","members")
          for name in targets:
              url=f"{base}/rest/v1/{name}?select=*&limit=1"
              request=urllib.request.Request(url,headers={"apikey":key,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(request,timeout=25) as response:
                      status=response.status
                      body=response.read(4096)
              except urllib.error.HTTPError as error:
                  status=error.code
                  body=b""
              if status in (401,403):
                  print(name,": anonymous read denied (HTTP",status,")")
                  continue
              if status != 200:
                  raise RuntimeError(f"{name}: unexpected HTTP {status}; cannot verify tenant isolation")
              records=json.loads(body)
              if records != []:
                  raise RuntimeError(f"{name}: anonymous read returned private rows")
              print(name,": anonymous read returned no rows (RLS)")
          print("PASS: no unauthenticated access to contractor tables")
          PY
